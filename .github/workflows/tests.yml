name: tests
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pip install -r requirements-dev.txt
        # chdman (mame-tools) is NOT installed here on purpose (huge package): the .chd test skips itself.

      - name: Docs (broken links, pt/en parity, script twins)
        run: python3 tests/check_docs.py

      - name: Syntax
        run: |
          find scripts tests -name '*.py' -print0 | xargs -0 python3 -m py_compile
          # hook*.sh must stay byte-identical to what runs on the device (no comments, see scripts/pt-BR/LEIA-ME.md)
          find scripts tests -name '*.sh' ! -name 'hook.sh' ! -name 'hook_timer_restaurado.sh' -print0 | xargs -0 shellcheck -S warning

      - name: Download PSXPackager
        run: |
          curl -fsSL -o psx.tar.gz https://github.com/RupertAvery/PSXPackager/releases/download/v1.6.3/psxpackager-linux-x64.tar.gz
          mkdir psx && tar xzf psx.tar.gz -C psx
          BIN="$(find "$PWD/psx" -name psxpackager -type f | head -1)"
          chmod +x "$BIN"
          echo "PSX=$BIN" >> "$GITHUB_ENV"

      - name: PS1 converter (bash, python, and the pt-BR twins)
        run: |
          for i in bash python bash-pt python-pt; do IMPL=$i bash tests/run_tests.sh; done

      - name: Config scripts and cover matching
        run: |
          IMPL=en bash tests/test_config.sh
          IMPL=pt bash tests/test_config.sh
          IMPL=en python3 tests/test_covers_matching.py
          IMPL=pt python3 tests/test_covers_matching.py
